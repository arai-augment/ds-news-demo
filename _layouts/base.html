<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body class="{{ page.theme | default: 'ds' }}">
<header class="hd"><div class="wrap">
  <a class="logo" href="{{ '/' | relative_url }}">{% if page.theme == 'rangle' %}RANGLE{% else %}DRONE SPORTS{% endif %}<small>ためし用</small></a>
  <nav><a href="{{ '/dronesports/' | relative_url }}">dronesports.jp 側</a><a href="{{ '/rangle/' | relative_url }}">rangle.jp 側</a></nav>
</div></header>
<main class="wrap">{{ content }}</main>
<footer class="ft"><div class="wrap">これはためし用のサイトです。実際のサイトではありません。</div></footer>
</body>
</html>
